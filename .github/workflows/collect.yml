name: Collect Kraken BTC/USD

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kraken-btc-usd-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Collect and validate
        id: collect
        run: |
          result=0
          python3 collect.py || result=$?
          if [[ "$result" == 2 ]]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          else
            exit "$result"
          fi
      - name: Publish validated data and collection status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/btc-usd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Kraken BTC/USD data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report collection failure
        if: steps.collect.outputs.partial == 'true'
        run: exit 1
